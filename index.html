<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>NFL Matchup Picker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #020617;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* Custom pulse animation for selection */
        @keyframes teamPulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.03); filter: brightness(1.2); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .animate-pulse-fast {
            animation: teamPulse 0.35s cubic-bezier(0.4, 0, 0.6, 1) forwards;
        }
        /* Safe area padding utilities */
        .pt-safe {
            padding-top: max(env(safe-area-inset-top), 2.5rem);
        }
        .pb-safe {
            padding-bottom: max(env(safe-area-inset-bottom), 1.5rem);
        }
    </style>
</head>
<body class="bg-slate-950 text-white w-full h-full">

    <!-- App Container -->
    <div id="app" class="w-full h-full flex flex-col">
        <!-- Dynamic content will be injected here -->
    </div>

    <!-- Loading / Error Screen -->
    <div id="loader" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div id="loader-spinner" class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loader-text" class="text-slate-300 font-medium text-lg">Loading NFL Matchups...</p>
        <button id="loader-retry" onclick="loadNFLSchedule()" class="mt-6 hidden bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-xl font-semibold shadow-lg transition">Try Again</button>
    </div>

    <script>
        // Team Branding Repository (Primary colors and logos)
        const NFL_TEAMS = {
            "ARI": { name: "Arizona Cardinals", city: "Arizona", color: "#97233F", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/ari.png" },
            "ATL": { name: "Atlanta Falcons", city: "Atlanta", color: "#A71930", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/atl.png" },
            "BAL": { name: "Baltimore Ravens", city: "Baltimore", color: "#241773", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/bal.png" },
            "BUF": { name: "Buffalo Bills", city: "Buffalo", color: "#00338D", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/buf.png" },
            "CAR": { name: "Carolina Panthers", city: "Carolina", color: "#0085CA", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/car.png" },
            "CHI": { name: "Chicago Bears", city: "Chicago", color: "#0B162A", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/chi.png" },
            "CIN": { name: "Cincinnati Bengals", city: "Cincinnati", color: "#FB4F14", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/cin.png" },
            "CLE": { name: "Cleveland Browns", city: "Cleveland", color: "#311D00", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/cle.png" },
            "DAL": { name: "Dallas Cowboys", city: "Dallas", color: "#003594", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/dal.png" },
            "DEN": { name: "Denver Broncos", city: "Denver", color: "#FB4F14", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/den.png" },
            "DET": { name: "Detroit Lions", city: "Detroit", color: "#0076B6", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/det.png" },
            "GB": { name: "Green Bay Packers", city: "Green Bay", color: "#203731", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/gb.png" },
            "HOU": { name: "Houston Texans", city: "Houston", color: "#03202F", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/hou.png" },
            "IND": { name: "Indianapolis Colts", city: "Indianapolis", color: "#002C5F", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/ind.png" },
            "JAX": { name: "Jacksonville Jaguars", city: "Jacksonville", color: "#006778", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/jax.png" },
            "KC": { name: "Kansas City Chiefs", city: "Kansas City", color: "#E31837", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/kc.png" },
            "LAC": { name: "Los Angeles Chargers", city: "Los Angeles", color: "#0080C6", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/lac.png" },
            "LAR": { name: "Los Angeles Rams", city: "Los Angeles", color: "#003594", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/lar.png" },
            "LV": { name: "Las Vegas Raiders", city: "Las Vegas", color: "#000000", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/lv.png" },
            "MIA": { name: "Miami Dolphins", city: "Miami", color: "#008E97", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/mia.png" },
            "MIN": { name: "Minnesota Vikings", city: "Minnesota", color: "#4F2683", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/min.png" },
            "NE": { name: "New England Patriots", city: "New England", color: "#002244", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/ne.png" },
            "NO": { name: "New Orleans Saints", city: "New Orleans", color: "#D3BC8D", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/no.png" },
            "NYG": { name: "New York Giants", city: "New York", color: "#0B2265", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/nyg.png" },
            "NYJ": { name: "New York Jets", city: "New York", color: "#125740", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/nyj.png" },
            "PHI": { name: "Philadelphia Eagles", city: "Philadelphia", color: "#004C54", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/phi.png" },
            "PIT": { name: "Pittsburgh Steelers", city: "Pittsburgh", color: "#FFB612", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/pit.png" },
            "SEA": { name: "Seattle Seahawks", city: "Seattle", color: "#002244", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/sea.png" },
            "SF": { name: "San Francisco 49ers", city: "San Francisco", color: "#AA0000", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/sf.png" },
            "TB": { name: "Tampa Bay Buccaneers", city: "Tampa Bay", color: "#D50A0A", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/tb.png" },
            "TEN": { name: "Tennessee Titans", city: "Tennessee", color: "#0C2340", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/ten.png" },
            "WAS": { name: "Washington Commanders", city: "Washington", color: "#5A1414", logo: "https://a.espncdn.com/i/teamlogos/nfl/500/was.png" }
        };

        let currentGames = [];
        let currentGameIndex = 0;
        let userPicks = [];

        function showLoader(visible, text = "Loading NFL Matchups...", showRetry = false) {
            const loader = document.getElementById("loader");
            const loaderText = document.getElementById("loader-text");
            const loaderSpinner = document.getElementById("loader-spinner");
            const loaderRetry = document.getElementById("loader-retry");

            if (visible) {
                loaderText.innerText = text;
                loaderSpinner.style.display = showRetry ? "none" : "block";
                loaderRetry.classList.toggle("hidden", !showRetry);
                loader.classList.remove("hidden");
            } else {
                loader.classList.add("hidden");
            }
        }

        function updateThemeColor(color) {
            let metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', color);
        }

        async function loadNFLSchedule() {
            showLoader(true, "Fetching live schedule...");
            try {
                const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard");
                if (!res.ok) throw new Error("HTTP error " + res.status);
                const data = await res.json();
                
                const rawEvents = data.events || [];
                const parsedGames = rawEvents.map(evt => {
                    const comp = evt.competitions[0];
                    const homeCompetitor = comp.competitors.find(c => c.homeAway === 'home');
                    const awayCompetitor = comp.competitors.find(c => c.homeAway === 'away');

                    const homeAbbr = homeCompetitor.team.abbreviation;
                    const awayAbbr = awayCompetitor.team.abbreviation;

                    const homeInfo = NFL_TEAMS[homeAbbr] || {
                        name: homeCompetitor.team.displayName,
                        city: homeCompetitor.team.location,
                        color: "#1e293b",
                        logo: homeCompetitor.team.logo
                    };

                    const awayInfo = NFL_TEAMS[awayAbbr] || {
                        name: awayCompetitor.team.displayName,
                        city: awayCompetitor.team.location,
                        color: "#0f172a",
                        logo: awayCompetitor.team.logo
                    };

                    const startDate = new Date(evt.date);

                    return {
                        id: evt.id,
                        date: startDate,
                        dateFormatted: startDate.toLocaleDateString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' }),
                        home: {
                            ...homeInfo,
                            record: homeCompetitor.records?.[0]?.summary ? `(${homeCompetitor.records[0].summary})` : "" }, away: { ...awayInfo, record: awayCompetitor.records?.[0]?.summary ? `(${awayCompetitor.records[0].summary})` : ""
                        }
                    };
                });

                // Filter logic based on current day/time window
                const now = new Date();
                const dayOfWeek = now.getDay(); // 0 = Sun, 4 = Thu
                const currentHour = now.getHours();

                currentGames = parsedGames.filter(game => {
                    const gameDay = game.date.getDay();
                    if (dayOfWeek >= 4 && (dayOfWeek !== 4 || currentHour >= 20)) {
                        return gameDay >= 4 || gameDay <= 1;
                    } else if (dayOfWeek === 0 && currentHour >= 13) {
                        return gameDay === 0 || gameDay === 1;
                    }
                    return true;
                });

                if (currentGames.length === 0) currentGames = parsedGames;

                currentGames.sort((a, b) => a.date - b.date);
                
                currentGameIndex = 0;
                userPicks = [];
                showLoader(false);
                renderMatchup();

            } catch (err) {
                console.error(err);
                showLoader(true, "Unable to load schedule. Please check connection.", true);
            }
        }

        function renderMatchup() {
            if (currentGameIndex >= currentGames.length) {
                showReviewScreen();
                return;
            }

            const game = currentGames[currentGameIndex];
            const app = document.getElementById("app");
            
            updateThemeColor(game.away.color);

            app.innerHTML = `
                <div class="w-full h-full flex flex-col min-h-[100dvh]">
                    <!-- Away Team (Top) -->
                    <div id="away-btn" onclick="makePick('away')" class="flex-1 flex flex-col items-center justify-between pt-safe pb-4 px-6 text-center transition-all cursor-pointer relative overflow-hidden" style="background-color: ${game.away.color}">
                        <div class="w-full flex justify-center z-10 mb-2">
                            <span class="bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider text-slate-200 shadow-md">
                                Game ${currentGameIndex + 1} of ${currentGames.length} &nbsp;\vert{}&nbsp; ${game.dateFormatted}
                            </span>
                        </div>
                        <div class="flex flex-col items-center z-10 my-auto">
                            <span class="text-xs uppercase tracking-widest font-extrabold text-white/70 mb-2">AWAY</span>
                            <div class="w-28 h-28 p-[5px] rounded-xl bg-white shadow-md flex items-center justify-center mb-4">
                                <img src="${game.away.logo}" class="max-w-full max-h-full object-contain" alt="${game.away.name}">
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-black text-white leading-tight drop-shadow-md">${game.away.name}</h2>
                            <p class="text-white/80 font-medium text-sm mt-1">${game.away.record}</p>
                        </div>
                        <div class="h-4 z-10"></div>
                    </div>

                    <!-- VS Divider -->
                    <div class="relative z-20 flex justify-center items-center h-0">
                        <div class="bg-slate-900 border-2 border-slate-700 text-white text-xs font-black rounded-full w-10 h-10 flex items-center justify-center shadow-xl">
                            VS
                        </div>
                    </div>

                    <!-- Home Team (Bottom) -->
                    <div id="home-btn" onclick="makePick('home')" class="flex-1 flex flex-col items-center justify-between pt-4 pb
